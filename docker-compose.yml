services:
  sac-flow:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-/api}"
        VITE_APP_BASE_PATH: "${VITE_APP_BASE_PATH:-/}"
    image: sac-flow:local
    init: true
    restart: unless-stopped
    ports:
      - "${SAC_FLOW_PORT:-8787}:8787"
    environment:
      NODE_ENV: production
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      API_HOST: 0.0.0.0
      PORT: 8787
      SERVE_FRONTEND: "true"
      SAC_FLOW_API_KEY: "${SAC_FLOW_API_KEY:-}"
      SAC_FLOW_REQUIRE_API_KEY: "${SAC_FLOW_REQUIRE_API_KEY:-false}"
      SAC_FLOW_CORS_ORIGINS: "${SAC_FLOW_CORS_ORIGINS:-}"
      SAC_FLOW_SECURITY_HEADERS: "${SAC_FLOW_SECURITY_HEADERS:-true}"
      SAC_FLOW_RATE_LIMIT_ENABLED: "${SAC_FLOW_RATE_LIMIT_ENABLED:-false}"
      SAC_FLOW_RATE_LIMIT_WINDOW_MS: "${SAC_FLOW_RATE_LIMIT_WINDOW_MS:-60000}"
      SAC_FLOW_RATE_LIMIT_MAX: "${SAC_FLOW_RATE_LIMIT_MAX:-600}"
      SAC_FLOW_REPOSITORY: "${SAC_FLOW_REPOSITORY:-json}"
      SAC_FLOW_DATA_FILE: /app/data/sac-flow.json
      SAC_FLOW_POSTGRES_URL: "${SAC_FLOW_POSTGRES_URL:-}"
      SAC_FLOW_ALLOW_JSON_IN_LIVE: "${SAC_FLOW_ALLOW_JSON_IN_LIVE:-}"
      SAC_FLOW_INBOX_SYNC_ENABLED: "${SAC_FLOW_INBOX_SYNC_ENABLED:-false}"
      SAC_FLOW_DISABLE_OUTBOUND_SENDS: "${SAC_FLOW_DISABLE_OUTBOUND_SENDS:-true}"
      SAC_FLOW_ENABLE_MANUAL_REPLIES: "${SAC_FLOW_ENABLE_MANUAL_REPLIES:-false}"
      SAC_FLOW_DISABLE_EXTERNAL_NODES: "${SAC_FLOW_DISABLE_EXTERNAL_NODES:-true}"
      SAC_FLOW_DISABLE_METRICOOL_MUTATIONS: "${SAC_FLOW_DISABLE_METRICOOL_MUTATIONS:-true}"
      SAC_FLOW_AUTO_REPLY_DISPATCH_MODE: "${SAC_FLOW_AUTO_REPLY_DISPATCH_MODE:-shadow}"
      SAC_FLOW_AUTO_REPLY_MAX_PENDING: "${SAC_FLOW_AUTO_REPLY_MAX_PENDING:-1000}"
      SAC_FLOW_CREDENTIALS_ENCRYPTION_KEY: "${SAC_FLOW_CREDENTIALS_ENCRYPTION_KEY:-local-compose-credential-key-change-before-production}"
      METRICOOL_MODE: "${METRICOOL_MODE:-demo}"
      METRICOOL_BASE_URL: "${METRICOOL_BASE_URL:-https://app.metricool.com/api}"
      METRICOOL_API_TOKEN: "${METRICOOL_API_TOKEN:-}"
      METRICOOL_USER_ID: "${METRICOOL_USER_ID:-}"
      METRICOOL_BLOG_ID: "${METRICOOL_BLOG_ID:-}"
      METRICOOL_ACCOUNTS_JSON: "${METRICOOL_ACCOUNTS_JSON:-}"
    volumes:
      - sac-flow-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  sac-flow-data:
    name: sac-flow-data
